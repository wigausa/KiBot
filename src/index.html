<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>KiBot</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Tipografía. Rutas relativas al <base href>: `/` en local y `/kibot/index.html` desplegado
       por InfraHub (una ruta relativa sale de su carpeta, `/kibot/`), por eso las @font-face van
       en un CSS estático y no en SCSS (ver fonts/poppins.css). -->
  <link rel="stylesheet" href="fonts/poppins.css">
  <!-- Pesos visibles en el primer render (cortina de arranque y títulos). -->
  <link rel="preload" href="fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/poppins-700-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>

</body>
