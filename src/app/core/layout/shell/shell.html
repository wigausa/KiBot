<div class="shell" [class.shell--expanded]="expanded()">
  <aside class="sidebar">
    <div class="sidebar__top">
      <button
        type="button"
        class="brand"
        [attr.aria-expanded]="expanded()"
        aria-label="Mostrar u ocultar los nombres de los módulos"
        (click)="toggleSidebar()"
      >
        @if (expanded()) {
          <witag-logo variant="full" [width]="132" alt="Witag" />
        } @else {
          <witag-logo variant="icon" [width]="40" alt="Witag" />
        }
      </button>
    </div>

    <nav class="sidebar__nav" aria-label="Módulos de KiBot">
      <ul class="nav">
        @for (item of navItems; track item.path) {
          <li>
            <a
              class="nav__item"
              [routerLink]="item.path"
              routerLinkActive="nav__item--active"
              [attr.title]="expanded() ? null : item.label"
            >
              <kibot-icon class="nav__icon" [name]="item.icon" />
              <span class="nav__label">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="sidebar__footer">
      <kibot-theme-toggle [showLabel]="expanded()" />

      <div class="robot">
        <span class="robot__avatar" aria-hidden="true">
          <kibot-icon name="robot" />
        </span>
        <span class="robot__details">
          <span class="robot__name">KiBot</span>
          <span class="robot__meta">Bodega 7000</span>
        </span>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
