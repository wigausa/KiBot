<div class="shell" [class.shell--expanded]="expanded()">
  <aside class="sidebar">
    <div class="sidebar__top">
      <button
        type="button"
        class="brand"
        [attr.aria-expanded]="expanded()"
        aria-label="Mostrar u ocultar los nombres de los módulos"
        (click)="toggleSidebar()"
      >
        @if (expanded()) {
          <witag-logo variant="full" tone="on-brand" [width]="132" alt="Witag" />
        } @else {
          <witag-logo variant="icon" tone="on-brand" [width]="40" alt="Witag" />
        }
      </button>
    </div>

    <nav class="sidebar__nav" aria-label="Módulos de KiBot">
      <ul class="nav">
        @for (item of navItems; track item.path) {
          <li>
            <a
              class="nav__item"
              [routerLink]="item.path"
              routerLinkActive="nav__item--active"
              ariaCurrentWhenActive="page"
              [attr.title]="expanded() ? null : item.titulo"
            >
              <kibot-icon class="nav__icon" [name]="item.icon" />
              <span class="nav__label">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="sidebar__footer">
      <kibot-theme-toggle [showLabel]="expanded()" />

      @if (sesion.usuario; as usuario) {
        <div class="sesion">
          @if (expanded()) {
            <span class="sesion__usuario" [attr.title]="usuario">{{ usuario }}</span>
          }
          <button type="button" class="sesion__salir" (click)="sesion.cerrar()">
            {{ expanded() ? 'Cerrar sesión' : 'Salir' }}
          </button>
        </div>
      }
    </div>
  </aside>

  <div class="principal">
    <main class="content">
      <router-outlet />
    </main>
    @if (!enControl()) {
      <kibot-mini-player />
    }
  </div>
</div>

<kibot-confirm-host />
