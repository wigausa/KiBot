# Despliega KiBot (pruebas) en su Static Web App.
#
# Se lanza con cada push a `testing` (la rama que se despliega) o a mano desde Actions.
#
# Necesita en Azure y en GitHub:
#   - la Static Web App (p. ej. swa-kibot-test) y su token de despliegue -> secreto KIBOT_SWA_TOKEN_TEST
#   - la subscription key de APIM de pruebas                               -> secreto KIBOT_APIM_KEY_TEST
#   - la URL de la SWA como redirect URI en el app registration de Witag (B2C) y en el CORS de APIM
# Mientras falte el token, compila pero no despliega (avisa y termina en verde).
#
# La key entra en el bundle con --define (ver src/environments/apim-key.ts): viaja al navegador,
# como en WitagFrontend, pero no queda en git.
name: Desplegar KiBot (pruebas)

on:
  push:
    branches: [testing]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (configuración test)
        env:
          KIBOT_APIM_KEY: ${{ secrets.KIBOT_APIM_KEY_TEST }}
        run: npx ng build -c test --define "KIBOT_APIM_KEY='${KIBOT_APIM_KEY}'"

      - name: ¿Existe ya la Static Web App?
        id: swa
        env:
          TOKEN: ${{ secrets.KIBOT_SWA_TOKEN_TEST }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Falta el secreto KIBOT_SWA_TOKEN_TEST: se compiló pero no se despliega."
            echo "lista=false" >> "$GITHUB_OUTPUT"
          else
            echo "lista=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar a Static Web Apps
        if: steps.swa.outputs.lista == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.KIBOT_SWA_TOKEN_TEST }}
          action: upload
          app_location: dist/KiBot/browser
          skip_app_build: true
